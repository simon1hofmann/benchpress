[general]
basis_gates = ['id', 'sx', 'x', 'rz', 'cz']
backend_name = 'fake_torino' # Both 'fake_torino' and 'FakeTorino' name formats are supported
abstract_topologies = ['all-to-all', 'square', 'heavy-hex', 'linear']

[bqskit]
optimization_level = 1 # Setting this higher will lead to dramatically longer runtimes
max_synthesis_size = 3 # Currently do not use this setting

[braket]

[cirq]

[qiskit]
optimization_level = 2

[tket]
optimization_level = 2
maxwidth = 500

[staq]
optimization_level = 2 # Setting this higher removes qubit connectivity
layout = 'bestfit'
mapping = 'swap'

[qpanda]
optimization_level = 2

[mqt]
# Target compilation uses CompilerTarget + TargetEnvironment. The composed
# MQT pipeline owns its mapping and synthesis configuration.
# Mapping uses one identity/random trial per available logical CPU and adds
# greedy candidates for eligible programs. The adapter does not override seed or trials.
# native_gates overrides general.basis_gates for the target operation menu. For
# a concrete backend, every entry must also be exposed by that backend.
# native_gates = ['sx', 'x', 'rz', 'cz']
# Normalize global phases before compile_for_target (disabled by default).
normalize_global_phases = False
